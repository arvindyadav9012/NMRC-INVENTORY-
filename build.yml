name: Build NMRC INVENTORY APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Locate Gradle Wrapper
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort
          echo "Searching for gradlew:"
          find . -type f -name gradlew -print

      - name: Build APK
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew is missing from the GitHub repository."
            exit 1
          fi

          chmod +x "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NMRC-INVENTORY-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
