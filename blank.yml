name: NMRC BUILD
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Build
        run: |
          ls -la
          unzip -o "NMRC_INVENTORY_ANDROID_BUILD_FIX_V2.zip"
          ls -la
          GRADLEW=$(find. -name gradlew -type f | head -n 1)
          echo "Found: $GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Building in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          # Logo replace - white bg pink text wala
          if [ -f "../../logo.png" ]; then
            echo "Replacing logos..."
            find. -name "ic_launcher.png" -exec cp "../../logo.png" {} \;
            find. -name "ic_launcher_round.png" -exec cp "../../logo.png" {} \;
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi
          sed -i 's/android:label="[^"]*"/android:label="NMRC INVENTORY"/' app/src/main/AndroidManifest.xml || true
          chmod +x gradlew
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NMRC-FINAL-APK
          path: '**/build/outputs/apk/debug/*.apk'
