name: NMRC BUILD
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Fix Name and Logo
        run: |
          ZIP=$(ls *.zip | head -1)
          rm -rf src && mkdir src && unzip -q "$ZIP" -d src
          DIR=$(find src -name "gradlew" | head -1 | xargs dirname)
          echo "GRADLE_DIR=$DIR" >> $GITHUB_ENV
          chmod +x $DIR/gradlew
          pip install pillow -q
          python3 << 'PY'
          import glob, re, os, shutil
          from PIL import Image
          for mf in glob.glob('src/**/AndroidManifest.xml', recursive=True):
              txt=open(mf,encoding='utf-8',errors='ignore').read()
              txt=re.sub(r'android:label="[^"]*"', 'android:label="NMRC INVENTORY"', txt)
              open(mf,'w',encoding='utf-8').write(txt)
          for d in glob.glob('src/**/mipmap-anydpi*', recursive=True):
              shutil.rmtree(d, ignore_errors=True)
          for d in glob.glob('src/**/res/mipmap-*', recursive=True):
              for f in glob.glob(os.path.join(d,"ic_launcher*")):
                  try: os.remove(f)
                  except: pass
          im=Image.open('logo.png').convert("RGBA")
          for d in glob.glob('src/**/res/mipmap-*', recursive=True):
              if not os.path.isdir(d): continue
              for s in [48,72,96,144,192]:
                  c=Image.new("RGBA",(s,s),(255,255,255,255))
                  l=im.resize((int(s*0.85),int(s*0.85)), Image.LANCZOS)
                  c.paste(l,((s-l.width)//2,(s-l.height)//2),l)
                  c.convert("RGB").save(os.path.join(d,"ic_launcher.png"))
                  c.convert("RGB").save(os.path.join(d,"ic_launcher_round.png"))
          print("FIX DONE")
          PY
      - run: cd ${{ env.GRADLE_DIR }} &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NMRC-FINAL-APK
          path: '**/build/outputs/apk/debug/*.apk'
