name: NMRC BUILD
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Name and Logo
        run: |
          # Find zip file safely
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
            rm "$ZIP_FILE"
          fi
          # Find gradle project folder
          PROJECT_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          # Replace logo
          if [ -f "../../logo.png" ]; then
            echo "Replacing logo..."
            find . -type d -name "mipmap-*" -exec cp ../../logo.png {}/ic_launcher.png \;
            find . -type d -name "mipmap-*" -exec cp ../../logo.png {}/ic_launcher_round.png \;
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
            rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
          fi
          # Fix app name
          sed -i 's/android:label=".*"/android:label="NMRC INVENTORY"/' app/src/main/AndroidManifest.xml || true

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NMRC-FINAL-APK
          path: '**/build/outputs/apk/debug/*.apk'
