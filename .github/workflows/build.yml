name: Build NMRC
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - run: |
          ZIP=$(ls *.zip | head -1)
          rm -rf src && mkdir src && unzip -q "$ZIP" -d src
          DIR=$(find src -name "gradlew" | head -1 | xargs dirname)
          echo "GRADLE_DIR=$DIR" >> $GITHUB_ENV
          chmod +x $DIR/gradlew
          find $DIR -name "strings.xml" -exec sed -i 's/.*app_name.*/ <string name="app_name">NMRC INVENTORY<\/string>/g' {} \;
          find $DIR -name "AndroidManifest.xml" -exec sed -i 's/android:label="[^"]*"/android:label="NMRC INVENTORY"/g' {} \;
          [ -f logo.png ] && find $DIR -type d -name "mipmap-*" -exec cp logo.png {}/ic_launcher.png \; -exec cp logo.png {}/ic_launcher_round.png \; || echo "logo.png missing"
      - run: cd ${{ env.GRADLE_DIR }} &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NMRC-INVENTORY-APK
          path: '**/build/outputs/apk/debug/*.apk'
