name: NMRC
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - run: |
          ZIP=$(ls *.zip | head -1)
          rm -rf src && mkdir src && unzip -q "$ZIP" -d src
          DIR=$(find src -name "gradlew" | head -1 | xargs dirname)
          echo "GRADLE_DIR=$DIR" >> $GITHUB_ENV
          chmod +x $DIR/gradlew
          find $DIR -name "strings.xml" -exec sed -i 's#<string name="app_name">.*</string>#<string name="app_name">NMRC INVENTORY</string>#g' {} \;
          find $DIR -name "ic_launcher*.xml" -delete
          rm -rf $DIR/app/src/main/res/mipmap-anydpi-v26
          find $DIR -name "ic_launcher*.png" -delete
          pip install pillow -q
          python3 -c "
          from PIL import Image
          import glob, os
          im=Image.open('logo.png').convert('RGBA')
          for d in glob.glob('src/**/mipmap-*', recursive=True):
            if not os.path.isdir(d): continue
            for s in [48,72,96,144,192]:
              c=Image.new('RGBA',(s,s),(255,255,255,255))
              l=im.resize((int(s*0.9),int(s*0.9)), Image.LANCZOS)
              c.paste(l,((s-l.width)//2,(s-l.height)//2),l)
              c.convert('RGB').save(os.path.join(d,'ic_launcher.png'))
              c.convert('RGB').save(os.path.join(d,'ic_launcher_round.png'))
          "
      - run: cd ${{ env.GRADLE_DIR }} &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NMRC-APK
          path: '**/build/outputs/apk/debug/*.apk'
