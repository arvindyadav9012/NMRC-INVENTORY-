name: NMRC
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Build
        run: |
          ZIP=$(ls *.zip | head -1)
          rm -rf src && mkdir src && unzip -q "$ZIP" -d src
          DIR=$(find src -name "gradlew" | head -1 | xargs dirname)
          echo "GRADLE_DIR=$DIR" >> $GITHUB_ENV
          chmod +x $DIR/gradlew
          pip install pillow -q
          python3 << 'PY'
          import glob, os
          from PIL import Image
          # 1. NAAM FIX - Safe tarika
          for f in glob.glob('src/**/strings.xml', recursive=True):
              try:
                  txt = open(f, encoding='utf-8', errors='ignore').read()
                  if 'app_name' in txt:
                      # purane app_name ko replace
                      import re
                      txt = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">NMRC INVENTORY</string>', txt, flags=re.DOTALL)
                      open(f,'w',encoding='utf-8').write(txt)
                      print(f"Name fixed in {f}")
              except: pass

          # 2. LOGO FIX
          for d in glob.glob('src/**/mipmap-anydpi*', recursive=True):
              import shutil; shutil.rmtree(d, ignore_errors=True)
          for d in glob.glob('src/**/res/mipmap-*', recursive=True):
              if not os.path.isdir(d): continue
              for old in glob.glob(os.path.join(d, "ic_launcher*")):
                  try: os.remove(old)
                  except: pass

          im = Image.open('logo.png').convert("RGBA")
          for d in glob.glob('src/**/res/mipmap-*', recursive=True):
              if not os.path.isdir(d): continue
              for s in [48,72,96,144,192]:
                  canvas = Image.new("RGBA", (s,s), (255,255,255,255))
                  logo = im.resize((int(s*0.85), int(s*0.85)), Image.LANCZOS)
                  canvas.paste(logo, ((s-logo.width)//2, (s-logo.height)//2), logo)
                  rgb = canvas.convert("RGB")
                  rgb.save(os.path.join(d, "ic_launcher.png"))
                  rgb.save(os.path.join(d, "ic_launcher_round.png"))
          print("LOGO + NAME DONE")
          PY

      - name: Assemble APK
        run: cd ${{ env.GRADLE_DIR }} &&./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NMRC-INVENTORY-FINAL
          path: '**/build/outputs/apk/debug/*.apk'
