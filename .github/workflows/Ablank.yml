name: Build NMRC INVENTORY FINAL FIX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

            - name: Force Change Name and Logo
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "ZIP FOUND: $ZIP"
          rm -rf src
          mkdir src
          unzip -o -q "$ZIP" -d src
          DIR=$(find src -name "gradlew" -type f | head -1 | xargs dirname)
          echo "GRADLE DIR: $DIR"
          echo "GRADLE_DIR=$DIR" >> $GITHUB_ENV
          chmod +x $DIR/gradlew
          
          # ===== 1. APP NAME FORCE CHANGE =====
          echo "Changing App Name to NMRC INVENTORY in ALL files..."
          find "$DIR" -name "strings.xml" | while read f; do
            echo "Fixing $f"
            cat "$f"
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">NMRC INVENTORY<\/string>/g' "$f"
            # Agar app_name tag nahi mila to add karo
            if ! grep -q "app_name" "$f"; then
              sed -i 's/<resources>/<resources>\n    <string name="app_name">NMRC INVENTORY<\/string>/g' "$f"
            fi
            cat "$f"
          done
          
          # ===== 2. LOGO FORCE CHANGE =====
          if [ -f "logo.png" ]; then
            echo "logo.png found! Converting and replacing..."
            cat > /tmp/fix_logo.py << 'PY'
          from PIL import Image
          import os, glob
          src = "logo.png"
          im = Image.open(src).convert("RGBA")
          # White background square icon
          for path in glob.glob("src/**/mipmap-*/", recursive=True):
              for sz in [192]:
                  bg = Image.new("RGBA", (512,512), (255,255,255,255))
                  logo = im.resize((460,460), Image.LANCZOS)
                  bg.paste(logo, (26,26), logo)
                  # Save in multiple sizes
                  for out_sz, folder_suffix in [(48,"-mdpi"),(72,"-hdpi"),(96,"-xhdpi"),(144,"-xxhdpi"),(192,"-xxxhdpi")]:
                      import pathlib
                      out_path = os.path.join(path)
                      # We'll generate one by one outside, simple copy for now
                  # For this folder, save
                  resized = bg.resize((192,192), Image.LANCZOS) if "xxxhdpi" in path else bg.resize((144,144), Image.LANCZOS) if "xxhdpi" in path else bg.resize((96,96), Image.LANCZOS) if "xhdpi" in path else bg.resize((72,72), Image.LANCZOS) if "hdpi" in path else bg.resize((48,48), Image.LANCZOS)
                  resized.save(os.path.join(path, "ic_launcher.png"))
                  resized.save(os.path.join(path, "ic_launcher_round.png"))
                  resized.save(os.path.join(path, "ic_launcher_foreground.png"))
          print("Logo replaced everywhere")
          PY
            pip install pillow -q
            python /tmp/fix_logo.py
            echo "=== After Logo Replace ==="
            ls -R "$DIR/app/src/main/res/" | grep mipmap -A 2
          else
            echo "ERROR: logo.png nahi mila! Please repo root me logo.png upload karo"
            exit 1
          fi

          # ===== 3. PERMISSIONS =====
          MAN=$(find "$DIR" -name "AndroidManifest.xml" | head -1)
          echo "Manifest: $MAN"
          if ! grep -q "ACCESS_FINE_LOCATION" "$MAN"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />' "$MAN"
          fi
          cat "$MAN"

            - name: Build APK
        run: |
          cd ${{ env.GRADLE_DIR }}
          ./gradlew assembleDebug --no-daemon

            - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NMRC-INVENTORY-FINAL-FIXED
          path: '**/build/outputs/apk/debug/*.apk'
