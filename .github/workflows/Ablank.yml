name: NMRC DEBUG
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - run: |
          ZIP=$(ls *.zip | head -1)
          rm -rf src && mkdir src && unzip -q "$ZIP" -d src
          echo "=== SARE strings.xml ==="
          find src -name "strings.xml" | head -20
          echo "=== SARE AndroidManifest.xml ==="
          find src -name "AndroidManifest.xml" | head -20
          echo "=== Mipmap folders ==="
          find src -type d -name "mipmap*" | head -20

          DIR=$(find src -name "gradlew" | head -1 | xargs dirname)
          echo "GRADLE_DIR=$DIR" >> $GITHUB_ENV
          chmod +x $DIR/gradlew

          # FINAL FIX - Naam ko 2 jagah se lock kar diya
          pip install pillow -q
          python3 << 'PY'
          import glob, re, os
          from PIL import Image
          # 1. Manifest me direct naam likh do
          for mf in glob.glob('src/**/AndroidManifest.xml', recursive=True):
              t=open(mf,encoding='utf-8',errors='ignore').read()
              t=re.sub(r'android:label="[^"]*"', 'android:label="NMRC INVENTORY"', t)
              open(mf,'w',encoding='utf-8').write(t)
              print(f"Manifest fixed: {mf}")
          # 2. strings.xml me bhi
          for sf in glob.glob('src/**/strings.xml', recursive=True):
              t=open(sf,encoding='utf-8',errors='ignore').read()
              if 'app_name' in t:
                  t=re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">NMRC INVENTORY</string>', t, flags=re.DOTALL)
                  open(sf,'w',encoding='utf-8').write(t)
                  print(f"String fixed: {sf}")

          # 3. Logo
          for d in glob.glob('src/**/mipmap-anydpi*', recursive=True):
              import shutil; shutil.rmtree(d, ignore_errors=True)
          for d in glob.glob('src/**/res/mipmap-*', recursive=True):
              for f in glob.glob(os.path.join(d, "ic_launcher*")):
                  try: os.remove(f)
                  except: pass
          im=Image.open('logo.png').convert("RGBA")
          for d in glob.glob('src/**/res/mipmap-*', recursive=True):
              if not os.path.isdir(d): continue
              for s in [48,72,96,144,192]:
                  c=Image.new("RGBA",(s,s),(255,255,255,255))
                  l=im.resize((int(s*0.85), int(s*0.85)), Image.LANCZOS)
                  c.paste(l,((s-l.width)//2,(s-l.height)//2),l)
                  c.convert("RGB").save(os.path.join(d,"ic_launcher.png"))
                  c.convert("RGB").save(os.path.join(d,"ic_launcher_round.png"))
          print("DONE")
          PY

      - run: cd ${{ env.GRADLE_DIR }} &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NMRC-FINAL
          path: '**/build/outputs/apk/debug/*.apk'
