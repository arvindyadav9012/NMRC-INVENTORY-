name: Build NMRC INVENTORY
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build Proper APK with Name Logo Permission
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "ZIP: $ZIP"
          rm -rf project
          mkdir -p project
          unzip -o -q "$ZIP" -d project/www
          
          mkdir -p project/app/src/main/java/com/nmrc/inventory
          mkdir -p project/app/src/main/res/values
          mkdir -p project/app/src/main/res/mipmap-xxxhdpi
          mkdir -p project/app/src/main/assets
          mkdir -p project/gradle/wrapper
          
          # Copy website to assets
          cp -r project/www/* project/app/src/main/assets/ 2>/dev/null || cp -r project/www/*/* project/app/src/main/assets/ 2>/dev/null || true
          ls project/app/src/main/assets/
          
          # Logo generate
          cat > /tmp/logo.py << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGBA', (512,512), (13,71,161,255))
          d = ImageDraw.Draw(img)
          d.rectangle([15,15,497,497], outline=(255,255,255,255), width=12)
          try:
              d.text((256,200), "NMRC", fill="white", anchor="mm", font=ImageFont.truetype("DejaVuSans-Bold.ttf", 120))
              d.text((256,330), "INVENTORY", fill="white", anchor="mm", font=ImageFont.truetype("DejaVuSans-Bold.ttf", 40))
          except:
              d.text((150,200), "NMRC", fill="white")
              d.text((80,300), "INVENTORY", fill="white")
          img.save("project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          img.save("project/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png")
          PY
          pip install pillow -q
          python /tmp/logo.py
          
          echo '<resources><string name="app_name">NMRC INVENTORY</string></resources>' > project/app/src/main/res/values/strings.xml
          
          cat > project/app/src/main/AndroidManifest.xml << 'MAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity>
              </application>
          </manifest>
          MAN
          
          cat > project/app/src/main/java/com/nmrc/inventory/MainActivity.java << 'JAVA'
          package com.nmrc.inventory;
          import android.os.Bundle;
          import android.webkit.*;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          public class MainActivity extends AppCompatActivity {
              WebView wv;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  wv = new WebView(this);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.getSettings().setDomStorageEnabled(true);
                  wv.getSettings().setAllowFileAccess(true);
                  wv.getSettings().setGeolocationEnabled(true);
                  // Permission for location in WebView
                  wv.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
                  
                  // Runtime permissions - YEHI permission mangwayega
                  ActivityCompat.requestPermissions(this, new String[]{
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.CAMERA
                  }, 101);
              }
          }
          JAVA
          
          cat > project/build.gradle << 'GR'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          GR
          echo "include ':app'" > project/settings.gradle
          cat > project/app/build.gradle << 'GR'
          plugins { id 'com.android.application' }
          android { namespace 'com.nmrc.inventory'; compileSdk 34; defaultConfig { applicationId "com.nmrc.inventory"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          GR
          echo "distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-8.6-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists" > project/gradle/wrapper/gradle-wrapper.properties
          
          cd project
          gradle assembleDebug --no-daemon
          
      - uses: actions/upload-artifact@v4
        with:
          name: NMRC-INVENTORY-APK
          path: 'project/**/build/outputs/apk/debug/*.apk'
